[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "postparse"
version = "0.1.0"
authors = [
    { name = "Sebastian Pachl"}
]
description = "A package for parsing and analyzing data"
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "toml",
    "tqdm",
    "python-dotenv",
    "instaloader>=4.15.2",
    "telethon>=1.32.0",
    "nest-asyncio>=1.5.0",
    "pydantic>=2.7.4,<3.0.0",
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.32.0,<1.0.0",
    "python-jose[cryptography]>=3.3.0,<4.0.0",
    "python-multipart>=0.0.9,<1.0.0",
    "websockets>=12.0,<13.0.0",
    "redis>=5.0.0,<6.0.0",
    "python-json-logger>=2.0.0,<3.0.0",
    "click>=8.1.0,<9.0.0",
    "rich>=13.0.0,<14.0.0",
    "rich-click>=1.8.0,<2.0.0",
    "httpx>=0.27.0",
    "lxml>=5.0.0,<6.0.0",
    "pydantic-settings>=2.4,<3",
    "tzdata>=2024.1",
    "pydantic-ai-slim[anthropic,openai]>=2.61.0,<3",
    "openai>=3.37.0,<4",
    "tenacity>=8.2,<10",
]

[project.scripts]
postparse = "postparse.cli.main:main"

[project.optional-dependencies]
# Data-science stack used only by exploratory notebooks (not imported by src/ or tests/).
notebooks = [
    "xgboost",
    "matplotlib",
    "numpy",
    "pandas",
    "optuna",
    "optuna-integration",
    "scikit-learn",
    "scipy",
    "ipywidgets",
]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "pytest-socket>=0.7.0",
    "ruff>=0.6.0",
    "black>=23.7.0",
    "isort>=5.12.0",
    "mypy>=1.5.0",
    "pylint>=2.17.5",
    "httpx>=0.27.0",
    "fakeredis>=2.20.0,<3.0.0",
]
docs = [
    "mkdocs",
    "mkdocs-material",
]
all = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "black>=23.7.0",
    "isort>=5.12.0",
    "mypy>=1.5.0",
    "pylint>=2.17.5",
    "mkdocs",
    "mkdocs-material",
]
migrate = [
    "ftfy>=6.2",
]

[project.urls]
Homepage = "https://github.com/sebpachl/postparse"

[tool.hatch.build.targets.wheel]
packages = ["src/postparse"]

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "pytest-socket>=0.7.0",
    "ruff>=0.6.0",
    "black>=23.7.0",
    "isort>=5.12.0",
    "mypy>=1.5.0",
    "pylint>=2.17.5",
]

[tool.uv]
package = true

[tool.pytest.ini_options]
# Pytest-asyncio configuration
asyncio_mode = "auto"

# Block real network access (pytest-socket); only loopback connections are allowed.
# --disable-socket is not used because asyncio on Windows needs AF_INET socketpairs.
# Tests marked `live` are skipped unless --run-live is passed (see tests/conftest.py).
addopts = "--allow-hosts=127.0.0.1,localhost,::1"

# Filter out known harmless warnings from dependencies
filterwarnings = [
    # Suppress Telethon cleanup warnings during test teardown
    "ignore::ResourceWarning",
    "ignore:coroutine.*was never awaited:RuntimeWarning",
    # Suppress deprecation warnings we're actively fixing
    "ignore:datetime.datetime.utcnow.*is deprecated:DeprecationWarning",
]
# Register custom markers
markers = [
    "integration: marks tests as integration tests requiring external services",
    "slow: marks tests as slow running tests (deselect with '-m \"not slow\"')",
    "cache: marks tests requiring Redis or cache functionality",
    "live: talks to real LLM servers or external APIs (skipped unless --run-live)",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["playground", "notebooks", "docs", "instructions", "dist"]

[tool.ruff.lint]
# Rule set we are working towards. Not enforced yet (no CI gate, no autofix run);
# `uv run ruff check --statistics` shows the current backlog.
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
# Nothing is auto-fixed until the codebase is reformatted deliberately.
fixable = []

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency markers in parameter defaults are the framework idiom.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body"]
